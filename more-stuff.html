  <script>
//    document.getElementById("toggle_theme").addEventListener("click", () => {
//	document.body.classList.toggle("lights") });
let ctx; document.getElementById("toggle_theme").addEventListener("click", () => {
  document.body.classList.toggle("lights");
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  const buf = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = d.length; i--; ) {
    d[i] = (Math.random() * 2 - 1) * Math.exp(-i / d.length * 4); }
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const gain = ctx.createGain();
  gain.gain.value = 0.5;
  src.connect(gain).connect(ctx.destination);
  src.start(); });
</script></html>
